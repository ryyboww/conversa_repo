<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Convera Strategies inquiry</title>
  </head>
  <body style="margin:0;padding:24px;background:#f5f2ea;color:#12202a;font-family:Arial,sans-serif;line-height:1.55">
    <main style="max-width:680px;margin:0 auto;background:#ffffff;border:1px solid #d8d2c5;padding:32px">
      <p style="margin:0 0 8px;color:#9a6a24;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">Convera Strategies</p>
      <h1 style="margin:0 0 24px;font-family:Georgia,serif;font-size:30px;font-weight:500">New website inquiry</h1>
      <table role="presentation" style="width:100%;border-collapse:collapse">
        <tr><td style="padding:8px 12px 8px 0;font-weight:700;vertical-align:top">Name</td><td style="padding:8px 0">{{name}}</td></tr>
        <tr><td style="padding:8px 12px 8px 0;font-weight:700;vertical-align:top">Email</td><td style="padding:8px 0">{{email}}</td></tr>
        <tr><td style="padding:8px 12px 8px 0;font-weight:700;vertical-align:top">Organization</td><td style="padding:8px 0">{{organization}}</td></tr>
        <tr><td style="padding:8px 12px 8px 0;font-weight:700;vertical-align:top">Inquiry type</td><td style="padding:8px 0">{{reason}}</td></tr>
        <tr><td style="padding:8px 12px 8px 0;font-weight:700;vertical-align:top">Subject</td><td style="padding:8px 0">{{inquirySubject}}</td></tr>
      </table>
      <h2 style="margin:24px 0 8px;font-size:18px">Message</h2>
      <p style="margin:0;white-space:pre-wrap">{{message}}</p>
      <p style="margin:28px 0 0;padding-top:16px;border-top:1px solid #d8d2c5;color:#66717a;font-size:12px">Submitted through converastrategies.com.</p>
    </main>
  </body>
</html>
