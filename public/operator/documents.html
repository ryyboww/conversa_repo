<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera | Project Documents</title><style>body{margin:0;background:#0d0d0d;color:#f7f2e8;font:15px/1.45 system-ui,sans-serif}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:42px 0 80px}a{color:#d4b56a}.card{border:1px solid #35302a;background:#161616;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #3f3a33;border-radius:7px;background:#101010;color:#fff}button{background:#d4b56a;color:#111;border:0;font-weight:800;cursor:pointer}.muted{color:#aaa49b}.ok{color:#a8dbb2}.error{color:#ffb4ab}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><p><a href="/operator/projects.html">← Project Registry</a></p><h1>Secure Project Documents</h1><p class="muted">Native files are intentionally small. Use an external secure upload destination for larger or especially sensitive records.</p><div class="grid"><input id="key" type="password" placeholder="Operator key"><input id="project" placeholder="Project #"><button id="load">Load</button></div><div id="msg"></div><section class="card"><h2>Upload Convera document</h2><form id="upload"><select name="category"><option>Convera Deliverable</option><option>Reference</option><option>Data</option><option>Invoice</option><option>Agreement</option><option>Change Order</option><option>Other</option></select><select name="visibility"><option value="internal">Internal only</option><option value="client">Client-shareable</option></select><input name="file" type="file" required accept=".pdf,.docx,.xlsx,.txt,.csv,.png,.jpg,.jpeg"><textarea name="description" placeholder="Description"></textarea><button>Upload</button></form></section><section class="card"><h2>Request client documents</h2><div class="grid"><input id="recipient" type="email" placeholder="Client email"><select id="mode"><option value="native">Native ≤4 MB upload</option><option value="external">External secure-upload link</option></select><input id="external" placeholder="External secure upload URL"></div><textarea id="requested" placeholder="Documents requested"></textarea><textarea id="reqInstructions" placeholder="Instructions"></textarea><button id="request">Create & Send Secure Request</button></section><section id="docs"></section></main><script>const $=id=>document.getElementById(id),key=$('key'),project=$('project'),msg=$('msg');project.value=new URLSearchParams(location.search).get('project')||'';$('load').onclick=load;$('request').onclick=requestDocs;$('upload').onsubmit=upload;async function get(){const r=await fetch('/.netlify/functions/project-documents?projectNumber='+encodeURIComponent(project.value.trim()),{headers:{'X-Convera-Operator-Key':key.value}}),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function post(body){const r=await fetch('/.netlify/functions/project-documents',{method:'POST',headers:{'Content-Type':'application/json','X-Convera-Operator-Key':key.value},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){try{const d=await get();msg.className='ok';msg.textContent=`${d.documents.length} document(s), ${d.requests.length} request(s).`;render(d)}catch(e){msg.className='error';msg.textContent=e.message}}async function requestDocs(){try{const d=await post({action:'create_request',projectNumber:project.value.trim(),recipientEmail:$('recipient').value,uploadMode:$('mode').value,externalUploadUrl:$('external').value,requestedDocuments:$('requested').value,instructions:$('reqInstructions').value});msg.className='ok';msg.textContent=`Created ${d.request.requestId}${d.emailSent?' and sent email.':' (email provider not configured or delivery failed).'}`;load()}catch(e){msg.className='error';msg.textContent=e.message}}async function upload(ev){ev.preventDefault();try{const fd=new FormData(ev.target);fd.append('projectNumber',project.value.trim());const r=await fetch('/.netlify/functions/project-documents',{method:'POST',headers:{'X-Convera-Operator-Key':key.value},body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);msg.className='ok';msg.textContent=`Uploaded ${d.document.documentId}.`;ev.target.reset();load()}catch(e){msg.className='error';msg.textContent=e.message}}function render(d){$('docs').innerHTML='<h2>Documents</h2>'+((d.documents||[]).map(x=>`<article class="card"><strong>${e(x.documentId)}</strong> · ${e(x.originalName)}<p class="muted">${e(x.category)} · ${e(x.visibility)} · ${(x.sizeBytes/1024).toFixed(1)} KB</p><div class="actions"><button onclick="downloadDoc('${x.documentId}','${e(x.originalName)}')">Download</button>${x.visibility==='client'?`<button onclick="share('${x.documentId}')">Secure Share</button>`:''}</div></article>`).join('')||'<p class="muted">No documents.</p>')+'<h2>Requests</h2>'+((d.requests||[]).map(r=>`<article class="card"><strong>${e(r.requestId)}</strong> · ${e(r.status)}<p>${e(r.requestedDocuments||'')}</p><p class="muted">${e(r.uploadMode)} · expires ${e(r.expiresAt)}</p></article>`).join('')||'<p class="muted">No requests.</p>')}window.downloadDoc=async(id,name)=>{const r=await fetch(`/.netlify/functions/operator-document-download?projectNumber=${encodeURIComponent(project.value.trim())}&documentId=${encodeURIComponent(id)}`,{headers:{'X-Convera-Operator-Key':key.value}});if(!r.ok){const d=await r.json();msg.className='error';msg.textContent=d.error;return}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()};window.share=async id=>{const email=prompt('Recipient email');if(!email)return;try{const d=await post({action:'share',projectNumber:project.value.trim(),documentId:id,recipientEmail:email});msg.className='ok';msg.textContent=`Secure share created${d.emailSent?' and emailed.':''}`}catch(e){msg.className='error';msg.textContent=e.message}};function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
