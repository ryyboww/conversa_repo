<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera Strategies | Engagement Readiness</title><style>:root{color-scheme:dark;--bg:#0d0d0d;--panel:#171717;--ink:#f7f2e8;--muted:#aaa69e;--line:#34312b;--gold:#d4b56a;--bad:#ffb4ab;--ok:#a8dbb2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{width:min(900px,calc(100% - 32px));margin:auto;padding:42px 0 80px}a{color:var(--gold)}.eyebrow{color:var(--gold);font-size:.76rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;color:var(--muted);font-size:.82rem}input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;background:#101010;color:var(--ink);padding:10px 11px}button{background:var(--gold);color:#111;border:0;font-weight:800;cursor:pointer}.status{color:var(--muted)}.ready{color:var(--ok);font-weight:800}.blocked{color:var(--bad);font-weight:800}ul{line-height:1.65}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="eyebrow">Convera operator</div><h1>Engagement Readiness</h1><p><a href="/operator/projects.html">← Project Registry</a> · <a href="/operator/agreement.html">Agreements</a></p><p>This screen determines whether work may begin. It does not activate work automatically.</p><div class="panel grid"><label>Operator key<input id="key" type="password"></label><label>Project #<input id="project"></label><div><button id="load">Load Readiness</button></div></div><div id="status" class="status"></div><section class="panel"><h2 id="result">Not evaluated</h2><ul id="blockers"></ul><div class="grid"><label>Conflict review<select id="conflict"></select></label><label>Data-sensitivity review<select id="data"></select></label><label>Deposit/payment status<select id="deposit"></select></label><label>Deposit required amount<input id="amount" type="number" min="0" step="0.01"></label><label>Other client prerequisite<input id="label" placeholder="PO, vendor onboarding, insurance certificate…"></label><label>Prerequisite status<select id="prereq"></select></label></div><p><button id="save">Save & Recalculate</button></p></section></main><script>const $=id=>document.getElementById(id),hdr=()=>({'X-Convera-Operator-Key':$('key').value});let gates=[],deps=[];$('load').onclick=load;$('save').onclick=save;async function load(){try{const r=await fetch('/.netlify/functions/project-readiness?projectNumber='+encodeURIComponent($('project').value.trim().toUpperCase()),{headers:hdr()}),d=await r.json();if(!r.ok)throw Error(d.error);gates=d.gateStatuses;deps=d.depositStatuses;fill('conflict',gates,d.readiness.conflictReview);fill('data',gates,d.readiness.dataSensitivityReview);fill('deposit',deps,d.readiness.depositStatus);fill('prereq',gates,d.readiness.clientPrerequisiteStatus);$('amount').value=d.readiness.depositRequiredAmount||0;$('label').value=d.readiness.clientPrerequisiteLabel||'';render(d.readiness)}catch(e){$('status').textContent=e.message}}async function save(){try{const body={projectNumber:$('project').value.trim().toUpperCase(),conflictReview:$('conflict').value,dataSensitivityReview:$('data').value,depositStatus:$('deposit').value,depositRequiredAmount:Number($('amount').value||0),clientPrerequisiteLabel:$('label').value,clientPrerequisiteStatus:$('prereq').value},r=await fetch('/.netlify/functions/project-readiness',{method:'PATCH',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);render(d.readiness);$('status').textContent='Readiness review saved.'}catch(e){$('status').textContent=e.message}}function fill(id,vals,selected){$(id).innerHTML=vals.map(v=>`<option ${v===selected?'selected':''}>${v}</option>`).join('')}function render(r){$('result').textContent=r.ready?'READY TO START':'NOT READY TO START';$('result').className=r.ready?'ready':'blocked';$('blockers').innerHTML=r.blockers.length?r.blockers.map(x=>`<li>${esc(x)}</li>`).join(''):'<li>No readiness blockers remain.</li>';$('status').textContent=r.signedAgreementId?`Signed agreement: ${r.signedAgreementId}`:'No signed agreement on record.'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}const qp=new URLSearchParams(location.search).get('project');if(qp)$('project').value=qp;</script></body></html>
