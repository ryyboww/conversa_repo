<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera | Billing</title><style>body{margin:0;background:#0d0d0d;color:#f7f2e8;font:15px/1.45 system-ui,sans-serif}main{width:min(1120px,calc(100% - 32px));margin:auto;padding:42px 0 80px}a{color:#d4b56a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #35302a;background:#161616;border-radius:12px;padding:16px;margin:14px 0}input,select,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #3f3a33;border-radius:7px;background:#101010;color:#fff}button{background:#d4b56a;color:#111;border:0;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:2fr .6fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto}.muted{color:#aaa49b}.ok{color:#a8dbb2}.error{color:#ffb4ab}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}}</style></head><body><main><p><a href="/operator/projects.html">← Project Registry</a></p><h1>Billing & Payments</h1><p class="muted">Project-linked invoice and payment ledger. This is not general accounting software.</p><div class="grid"><input id="key" type="password" placeholder="Operator key"><input id="project" placeholder="Project #"><button id="load">Load</button></div><div id="msg"></div><section class="card"><h2>Create invoice</h2><div class="grid"><select id="type"><option>Deposit</option><option>Milestone</option><option>Final</option><option>Other</option></select><input id="title" placeholder="Invoice title"><input id="due" type="date"><input id="tax" type="number" min="0" step="0.01" placeholder="Tax / statutory charge"><input id="adjust" type="number" step="0.01" placeholder="Adjustment (+/-)"><input id="paymentUrl" placeholder="Hosted secure-payment URL (optional)"></div><div id="lines"><div class="row"><input class="desc" placeholder="Line item description"><input class="qty" type="number" min="0.01" step="0.01" value="1"><input class="price" type="number" min="0" step="0.01" placeholder="Unit price"></div></div><button id="addLine">Add line</button><textarea id="terms" rows="3" placeholder="Payment terms"></textarea><textarea id="instructions" rows="3" placeholder="Payment instructions"></textarea><button id="create">Create Draft Invoice</button></section><section id="invoices"></section></main><script>const $=id=>document.getElementById(id),msg=$('msg'),project=$('project'),key=$('key');project.value=new URLSearchParams(location.search).get('project')||'';$('load').onclick=load;$('addLine').onclick=()=>{$('lines').insertAdjacentHTML('beforeend','<div class="row"><input class="desc" placeholder="Line item description"><input class="qty" type="number" min="0.01" step="0.01" value="1"><input class="price" type="number" min="0" step="0.01" placeholder="Unit price"></div>')};$('create').onclick=create;async function api(method,body=''){const r=await fetch('/.netlify/functions/project-billing'+(method==='GET'?`?projectNumber=${encodeURIComponent(project.value.trim())}`:''),{method,headers:{...(body?{'Content-Type':'application/json'}:{}),'X-Convera-Operator-Key':key.value},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await api('GET');msg.className='ok';msg.textContent=`${d.invoices.length} invoice(s), ${d.payments.length} payment ledger entries.`;render(d.invoices,d.payments)}catch(e){msg.className='error';msg.textContent=e.message}}async function create(){try{const lineItems=[...document.querySelectorAll('#lines .row')].map(r=>({description:r.querySelector('.desc').value,quantity:Number(r.querySelector('.qty').value),unitPrice:Number(r.querySelector('.price').value)}));const d=await api('POST',{projectNumber:project.value.trim(),invoiceType:$('type').value,title:$('title').value,dueDate:$('due').value,taxAmount:Number($('tax').value||0),adjustmentAmount:Number($('adjust').value||0),hostedPaymentUrl:$('paymentUrl').value,paymentTerms:$('terms').value,paymentInstructions:$('instructions').value,lineItems});msg.className='ok';msg.textContent=`Created ${d.invoice.invoiceId}.`;load()}catch(e){msg.className='error';msg.textContent=e.message}}function render(invs,pays){$('invoices').innerHTML=invs.map(i=>`<article class="card"><h2>${e(i.invoiceId)} · ${e(i.status)}</h2><p>${e(i.title)} — ${e(i.currency)} ${Number(i.total).toFixed(2)} · Balance ${Number(i.balanceDue).toFixed(2)}</p><p class="muted">${e(i.invoiceType)} · Agreement ${e(i.agreementId||'—')} · Due ${e(i.dueDate||'—')}</p><div class="actions"><button onclick="act('${i.invoiceId}','send')">Send / Re-send</button><button onclick="payment('${i.invoiceId}','Payment')">Record Payment</button><button onclick="payment('${i.invoiceId}','Refund')">Record Refund</button><button onclick="act('${i.invoiceId}','void')">Void</button></div><details><summary>Payment ledger</summary>${pays.filter(p=>p.invoiceId===i.invoiceId).map(p=>`<p>${e(p.type)} ${e(p.paymentId)} · ${e(p.currency)} ${Number(p.amount).toFixed(2)} · ${e(p.receivedAt)}</p>`).join('')||'<p>None.</p>'}</details></article>`).join('')||'<p class="muted">No invoices.</p>'}window.act=async(id,action)=>{try{const d=await api('PATCH',{projectNumber:project.value.trim(),invoiceId:id,action});msg.className='ok';msg.textContent=action==='send'?`Invoice sent${d.emailSent?' and email delivered.':' (email provider not configured or delivery failed).'}`:'Updated.';load()}catch(e){msg.className='error';msg.textContent=e.message}};window.payment=async(id,type)=>{const amount=prompt(`${type} amount`);if(!amount)return;const reference=prompt('Payment/reference ID (optional)')||'';try{await api('PATCH',{projectNumber:project.value.trim(),invoiceId:id,action:'record_payment',paymentType:type,amount:Number(amount),reference});msg.className='ok';msg.textContent=`${type} recorded.`;load()}catch(e){msg.className='error';msg.textContent=e.message}};function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
