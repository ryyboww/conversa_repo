<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera Strategies | Project Activity</title><style>:root{color-scheme:dark;--bg:#0d0d0d;--panel:#171717;--ink:#f7f2e8;--muted:#aaa69e;--line:#34312b;--gold:#d4b56a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{width:min(900px,calc(100% - 32px));margin:auto;padding:42px 0 80px}a{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}input,button{font:inherit;border:1px solid var(--line);border-radius:8px;background:#101010;color:var(--ink);padding:10px 11px}button{background:var(--gold);color:#111;border:0;font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.item{border-left:2px solid var(--gold);padding:4px 0 14px 14px;margin:0 0 14px}.meta{color:var(--muted);font-size:.86rem}</style></head><body><main><h1>Project Activity</h1><p><a href="/operator/projects.html">← Project Registry</a></p><div class="panel toolbar"><input id="key" type="password" placeholder="Operator key"><input id="project" placeholder="Project #"><button id="load">Load Timeline</button></div><div id="status"></div><section class="panel" id="timeline">Load a project.</section></main><script>const $=id=>document.getElementById(id);$('load').onclick=load;async function load(){try{const p=$('project').value.trim().toUpperCase(),r=await fetch('/.netlify/functions/project-activity?projectNumber='+encodeURIComponent(p),{headers:{'X-Convera-Operator-Key':$('key').value}}),d=await r.json();if(!r.ok)throw Error(d.error);$('timeline').innerHTML=(d.activity||[]).map(x=>`<div class="item"><strong>${esc(x.summary)}</strong><div class="meta">${new Date(x.createdAt).toLocaleString()} · ${esc(x.type)}</div></div>`).join('')||'No project activity yet.';$('status').textContent=`${d.activity?.length||0} event(s).`}catch(e){$('status').textContent=e.message}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}const qp=new URLSearchParams(location.search).get('project');if(qp)$('project').value=qp;</script></body></html>
