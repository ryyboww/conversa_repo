<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera Strategies | Change Orders</title><style>:root{color-scheme:dark;--bg:#0d0d0d;--panel:#171717;--ink:#f7f2e8;--muted:#aaa69e;--line:#34312b;--gold:#d4b56a;--bad:#ffb4ab;--ok:#a8dbb2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{width:min(1050px,calc(100% - 32px));margin:auto;padding:42px 0 80px}a{color:var(--gold)}.eyebrow{color:var(--gold);font-size:.76rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(2rem,4vw,3rem);margin:.3rem 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}label{display:grid;gap:6px;color:var(--muted);font-size:.82rem}input,textarea,button{font:inherit;border:1px solid var(--line);border-radius:8px;background:#101010;color:var(--ink);padding:10px 11px}textarea{min-height:90px}button{background:var(--gold);color:#111;border:0;font-weight:800;cursor:pointer}.secondary{background:#292722;color:var(--ink)}.record{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status,.meta{color:var(--muted)}.error{color:var(--bad)}.ok{color:var(--ok)}@media(max-width:720px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><div class="eyebrow">Convera operator</div><h1>Change Orders</h1><p><a href="/operator/projects.html">← Project Registry</a> · <a href="/operator/agreement.html">Project Agreements</a></p><div class="panel grid"><label>Operator key<input id="key" type="password"></label><label>Project #<input id="project"></label><div class="wide"><button id="load" class="secondary">Load Change Orders</button></div></div><div id="status" class="status"></div><section class="panel"><h2>New Change Order</h2><div class="grid"><label>Title<input id="title"></label><label>Client email<input id="email" type="email"></label><label class="wide">Reason<textarea id="reason"></textarea></label><label class="wide">Scope additions<textarea id="add"></textarea></label><label class="wide">Scope removals<textarea id="remove"></textarea></label><label>Fee adjustment<textarea id="fee"></textarea></label><label>Timeline adjustment<textarea id="timeline"></textarea></label><label>Payment adjustment<textarea id="payment"></textarea></label><label>Effective impact<textarea id="impact"></textarea></label><label class="wide">External e-sign URL (optional)<input id="esign" type="url"></label><label class="wide">Approved Change Order terms<textarea id="terms"></textarea></label><label class="wide">Internal notes<textarea id="notes"></textarea></label><div class="wide"><button id="create">Create Draft Change Order</button></div></div></section><section class="panel"><h2>History</h2><div id="list">Load a project.</div></section></main><script>const $=id=>document.getElementById(id),hdr=()=>({'X-Convera-Operator-Key':$('key').value}),status=$('status'),list=$('list');$('load').onclick=load;$('create').onclick=create;async function load(){try{const p=$('project').value.trim().toUpperCase(),r=await fetch('/.netlify/functions/project-change-orders?projectNumber='+encodeURIComponent(p),{headers:hdr()}),d=await r.json();if(!r.ok)throw Error(d.error);render(d.changeOrders||[]);status.className='status';status.textContent=`${d.changeOrders?.length||0} Change Order record(s).`}catch(e){status.className='status error';status.textContent=e.message}}async function create(){try{const body={projectNumber:$('project').value.trim().toUpperCase(),title:$('title').value,clientEmail:$('email').value,reason:$('reason').value,scopeAdditions:$('add').value,scopeRemovals:$('remove').value,feeAdjustment:$('fee').value,timelineAdjustment:$('timeline').value,paymentAdjustment:$('payment').value,effectiveImpact:$('impact').value,externalSignatureUrl:$('esign').value,approvedTerms:$('terms').value,internalNotes:$('notes').value},r=await fetch('/.netlify/functions/project-change-orders',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);status.className='status ok';status.textContent=`${d.changeOrder.changeOrderId} created.`;await load()}catch(e){status.className='status error';status.textContent=e.message}}function render(rows){list.innerHTML=rows.length?'':'No Change Orders yet.';for(const c of rows){const box=document.createElement('div');box.className='record';box.innerHTML=`<strong>${esc(c.changeOrderId)}</strong> · ${esc(c.status)}<div class="meta">Agreement ${esc(c.agreementId)} · approved for use: ${c.approvedForUse?'Yes':'No'}</div><div class="actions"><button data-a>Approve for use</button><button data-s>Send</button><button class="secondary" data-r>Revise</button><button class="secondary" data-c>Record client signature</button><button class="secondary" data-v>Record Convera signature</button></div>`;box.querySelector('[data-a]').onclick=()=>act(c,'approve_terms');box.querySelector('[data-s]').onclick=()=>act(c,'send');box.querySelector('[data-r]').onclick=()=>act(c,'revise');box.querySelector('[data-c]').onclick=()=>sig(c,'client');box.querySelector('[data-v]').onclick=()=>sig(c,'convera');list.appendChild(box)}}async function act(c,action){if(!confirm(`${action} ${c.changeOrderId}?`))return;try{const r=await fetch('/.netlify/functions/project-change-orders',{method:'PATCH',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({projectNumber:c.projectNumber,changeOrderId:c.changeOrderId,action})}),d=await r.json();if(!r.ok)throw Error(d.error);status.className='status ok';status.textContent=d.message||'Updated.';await load()}catch(e){status.className='status error';status.textContent=e.message}}async function sig(c,side){const ref=prompt('Signed document reference:','');if(ref===null)return;try{const r=await fetch('/.netlify/functions/project-change-orders',{method:'PATCH',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({projectNumber:c.projectNumber,changeOrderId:c.changeOrderId,action:'record_signature',side,signatureMethod:'External e-sign / recorded evidence',signedDocumentReference:ref})}),d=await r.json();if(!r.ok)throw Error(d.error);status.className='status ok';status.textContent='Signature recorded.';await load()}catch(e){status.className='status error';status.textContent=e.message}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}const qp=new URLSearchParams(location.search).get('project');if(qp)$('project').value=qp;</script></body></html>
