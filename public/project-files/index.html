<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera Strategies | Secure Project Files</title><style>body{margin:0;background:#111;color:#f3ede1;font:16px/1.5 system-ui,sans-serif}main{width:min(760px,calc(100% - 32px));margin:48px auto}.brand{color:#d4b56a;text-transform:uppercase;letter-spacing:.15em;font-weight:800;font-size:.78rem}.card{background:#191919;border:1px solid #37322b;border-radius:14px;padding:24px;margin-top:18px}input,textarea,button{width:100%;box-sizing:border-box;margin-top:10px;padding:12px;border:1px solid #484139;border-radius:8px;background:#101010;color:#fff;font:inherit}button{background:#d4b56a;color:#111;border:0;font-weight:800;cursor:pointer}a{color:#d4b56a}.muted{color:#aaa49b}.error{color:#ffb4ab}.success{color:#a8dbb2}</style></head><body><main><div class="brand">Convera Strategies</div><h1>Secure Project Files</h1><div id="app" class="card">Loading secure request…</div></main><script>const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('token')||'',url='/.netlify/functions/client-documents?token='+encodeURIComponent(token);fetch(url).then(async r=>{if((r.headers.get('content-type')||'').includes('application/json')){const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to open secure link.');return d}if(!r.ok)throw Error('Unable to download document.');const b=await r.blob(),cd=r.headers.get('content-disposition')||'',m=/filename="([^"]+)"/.exec(cd),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=m?m[1]:'project-document';a.click();app.innerHTML='<p class="success">Your secure download has started.</p>';return null}).then(d=>{if(!d||d.kind!=='request')return;const r=d.request;if(r.uploadMode==='external'){app.innerHTML=`<h2>Document request</h2><p>${e(r.requestedDocuments||'Project documents requested.')}</p>${r.instructions?`<p class="muted">${e(r.instructions)}</p>`:''}<p><a href="${a(r.externalUploadUrl)}" rel="noopener noreferrer">Open secure upload destination</a></p><p class="muted">Request expires ${e(r.expiresAt)}.</p>`;return}app.innerHTML=`<h2>Document request</h2><p>${e(r.requestedDocuments||'Project documents requested.')}</p>${r.instructions?`<p class="muted">${e(r.instructions)}</p>`:''}<form id="f"><input name="email" type="email" required placeholder="Approved email address"><input name="file" type="file" required accept=".pdf,.docx,.xlsx,.txt,.csv,.png,.jpg,.jpeg"><textarea name="description" rows="3" placeholder="Optional description"></textarea><button>Upload securely</button></form><p class="muted">Native upload limit: ${(r.maxNativeBytes/1024/1024).toFixed(0)} MB. For larger or especially sensitive files, ask Convera for an external secure-upload request.</p><div id="msg"></div>`;document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const msg=document.getElementById('msg');msg.textContent='Uploading…';const rr=await fetch(url,{method:'POST',body:new FormData(ev.target)}),dd=await rr.json();if(!rr.ok){msg.className='error';msg.textContent=dd.error||'Upload failed.'}else{msg.className='success';msg.textContent=`Received ${dd.document.documentId}: ${dd.document.originalName}`;ev.target.reset()}}}).catch(err=>app.innerHTML=`<p class="error">${e(err.message)}</p>`);function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function a(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?e(u.href):'#'}catch{return'#'}}</script></body></html>
