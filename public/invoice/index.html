<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera Strategies | Invoice</title><style>body{margin:0;background:#f5f1e7;color:#191816;font:16px/1.55 Georgia,serif}main{width:min(820px,calc(100% - 32px));margin:40px auto;background:#fff;padding:42px;border:1px solid #d8d0c2}.brand{font:700 14px/1.2 system-ui;text-transform:uppercase;letter-spacing:.16em;color:#8a6b2f}h1{font-size:2.4rem;margin:.4rem 0}.meta{display:flex;flex-wrap:wrap;gap:18px;color:#625d55}.box{border-top:1px solid #d8d0c2;margin-top:28px;padding-top:22px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5dfd4}th:last-child,td:last-child{text-align:right}.totals{margin-left:auto;width:min(360px,100%)}.pay{display:inline-block;margin-top:18px;padding:12px 16px;background:#161616;color:#fff;text-decoration:none;border-radius:6px}.error{color:#8c1d18}@media(max-width:600px){main{margin:0;padding:24px;border:0}}</style></head><body><main><div class="brand">Convera Strategies</div><h1>Invoice</h1><div id="app">Loading…</div></main><script>const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('token')||'';fetch('/.netlify/functions/client-invoice?token='+encodeURIComponent(token)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load invoice.');return d.invoice}).then(i=>{app.innerHTML=`<div class="meta"><span><strong>${e(i.invoiceId)}</strong></span><span>Project ${e(i.projectNumber)}</span><span>${e(i.status)}</span></div><div class="box"><p><strong>${e(i.title)}</strong><br>${e(i.clientName||'')} ${i.clientOrganization?'· '+e(i.clientOrganization):''}</p><p>Issued: ${e(i.issueDate||'—')} ${i.dueDate?' · Due: '+e(i.dueDate):''}</p><table><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Amount</th></tr></thead><tbody>${(i.lineItems||[]).map(x=>`<tr><td>${e(x.description)}</td><td>${n(x.quantity)}</td><td>${money(i.currency,x.unitPrice)}</td><td>${money(i.currency,x.amount)}</td></tr>`).join('')}</tbody></table><table class="totals"><tr><td>Subtotal</td><td>${money(i.currency,i.subtotal)}</td></tr><tr><td>Tax / statutory charge</td><td>${money(i.currency,i.taxAmount)}</td></tr><tr><td>Adjustment</td><td>${money(i.currency,i.adjustmentAmount)}</td></tr><tr><td><strong>Total</strong></td><td><strong>${money(i.currency,i.total)}</strong></td></tr><tr><td>Paid</td><td>${money(i.currency,i.paidAmount)}</td></tr><tr><td><strong>Balance due</strong></td><td><strong>${money(i.currency,i.balanceDue)}</strong></td></tr></table>${i.paymentTerms?`<p><strong>Payment terms</strong><br>${e(i.paymentTerms)}</p>`:''}${i.paymentInstructions?`<p><strong>Payment instructions</strong><br>${e(i.paymentInstructions)}</p>`:''}${i.hostedPaymentUrl&&i.balanceDue>0?`<a class="pay" href="${a(i.hostedPaymentUrl)}" rel="noopener noreferrer">Continue to secure payment</a>`:''}</div><p style="color:#6b665f;font-size:.9rem">This invoice records an amount requested under the associated project agreement. Payment processing, if offered, occurs through the linked payment provider.</p>`}).catch(err=>app.innerHTML=`<p class="error">${e(err.message)}</p>`);function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function a(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?e(u.href):'#'}catch{return'#'}}function n(v){return Number(v||0).toLocaleString()}function money(c,v){return `${e(c||'USD')} ${Number(v||0).toFixed(2)}`}</script></body></html>
