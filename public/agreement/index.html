<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera Strategies | Project Agreement</title><style>:root{--bg:#f5f0e6;--ink:#151515;--muted:#655f55;--line:#d3c7b4;--gold:#7b6224}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}main{width:min(860px,calc(100% - 32px));margin:auto;padding:48px 0 80px}.eyebrow{color:var(--gold);font:700 .78rem/1.2 system-ui;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.3rem)}.card{background:#fffdf7;border:1px solid var(--line);padding:28px;border-radius:10px}.meta{color:var(--muted);font-family:system-ui,sans-serif}.section{border-top:1px solid var(--line);padding-top:16px;margin-top:20px;white-space:pre-wrap;line-height:1.65}.notice{background:#eee4cf;padding:14px;border-left:4px solid var(--gold);font-family:system-ui,sans-serif;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button,a.button{font:700 1rem system-ui;padding:11px 14px;border-radius:7px;border:0;background:#161616;color:white;text-decoration:none;cursor:pointer}.secondary{background:#6a6258!important}textarea{width:100%;min-height:90px;margin-top:12px;padding:10px;font:inherit}.status{font-family:system-ui,sans-serif;margin-top:14px}</style></head><body><main><div class="eyebrow">Convera Strategies</div><h1>Project Agreement</h1><div id="status" class="status">Loading agreement…</div><article id="card" class="card" hidden></article></main><script>const token=new URLSearchParams(location.search).get('access')||'',status=document.getElementById('status'),card=document.getElementById('card');load();async function load(){try{const r=await fetch('/.netlify/functions/client-agreement?access='+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw Error(d.error);render(d.agreement)}catch(e){status.textContent=e.message}}function render(a){status.textContent='';card.hidden=false;card.innerHTML=`<div class="meta">Project ${esc(a.projectNumber)} · Agreement ${esc(a.agreementId)} · ${esc(a.status)} · ${a.agreementSource==='client_supplied'?'Client-supplied agreement':'Convera agreement'}</div><h2>${esc(a.title)}</h2><div class="notice">Reviewing this agreement or selecting “Ready for signature” is not itself a signature. The signed agreement is tracked separately through Convera’s approved signature process.</div>${sec('Scope',a.scopeSummary)}${sec('Deliverables',a.deliverablesSummary)}${sec('Fees',a.feesSummary)}${sec('Payment terms',a.paymentTerms)}${sec('Expenses',a.expenses)}${sec('Client responsibilities',a.clientResponsibilities)}${sec('Convera responsibilities',a.converaResponsibilities)}${sec('Confidentiality',a.confidentiality)}${sec('Intellectual property',a.intellectualProperty)}${sec('Termination / cancellation',a.termination)}${sec('Change control',a.changeControl)}${sec('Governing law / venue',a.governingLaw)}${sec('Special terms',a.specialTerms)}${sec('Approved agreement terms',a.approvedTerms)}<textarea id="note" placeholder="Optional note or requested change"></textarea><div class="actions"><button data-ready>Ready for signature</button><button class="secondary" data-change>Request changes</button><button class="secondary" data-decline>Decline</button>${a.externalSignatureUrl?`<a class="button" href="${attr(a.externalSignatureUrl)}" rel="noopener noreferrer">Open signature service</a>`:''}</div>`;card.querySelector('[data-ready]').onclick=()=>respond('ready_to_sign');card.querySelector('[data-change]').onclick=()=>respond('request_changes');card.querySelector('[data-decline]').onclick=()=>respond('decline')}async function respond(action){try{const r=await fetch('/.netlify/functions/client-agreement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access:token,action,note:document.getElementById('note').value})}),d=await r.json();if(!r.ok)throw Error(d.error);status.textContent=d.message;await load()}catch(e){status.textContent=e.message}}function sec(t,v){return v?`<div class="section"><h3>${esc(t)}</h3>${esc(v)}</div>`:''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function attr(v){return esc(v)}</script></body></html>
