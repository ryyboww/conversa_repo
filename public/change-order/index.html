<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Convera Strategies | Change Order</title><style>:root{--bg:#f5f0e6;--ink:#151515;--muted:#655f55;--line:#d3c7b4;--gold:#7b6224}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}main{width:min(820px,calc(100% - 32px));margin:auto;padding:48px 0 80px}.card{background:#fffdf7;border:1px solid var(--line);padding:28px;border-radius:10px}.meta{color:var(--muted);font-family:system-ui,sans-serif}.section{border-top:1px solid var(--line);padding-top:16px;margin-top:20px;white-space:pre-wrap;line-height:1.65}.notice{background:#eee4cf;padding:14px;border-left:4px solid var(--gold);font-family:system-ui,sans-serif}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button{font:700 1rem system-ui;padding:11px 14px;border-radius:7px;border:0;background:#161616;color:white;cursor:pointer}.secondary{background:#6a6258}textarea{width:100%;min-height:90px;margin-top:12px;padding:10px}</style></head><body><main><h1>Change Order</h1><div id="status">Loading…</div><article id="card" class="card" hidden></article></main><script>const token=new URLSearchParams(location.search).get('access')||'',status=document.getElementById('status'),card=document.getElementById('card');load();async function load(){try{const r=await fetch('/.netlify/functions/client-change-order?access='+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw Error(d.error);render(d.changeOrder)}catch(e){status.textContent=e.message}}function render(c){status.textContent='';card.hidden=false;card.innerHTML=`<div class="meta">Project ${esc(c.projectNumber)} · ${esc(c.changeOrderId)} · Agreement ${esc(c.agreementId)} · ${esc(c.status)}</div><h2>${esc(c.title)}</h2><div class="notice">Reviewing this Change Order or indicating readiness to sign is not itself a signature.</div>${sec('Reason',c.reason)}${sec('Scope additions',c.scopeAdditions)}${sec('Scope removals',c.scopeRemovals)}${sec('Fee adjustment',c.feeAdjustment)}${sec('Timeline adjustment',c.timelineAdjustment)}${sec('Payment adjustment',c.paymentAdjustment)}${sec('Effective impact',c.effectiveImpact)}${sec('Approved Change Order terms',c.approvedTerms)}<textarea id="note" placeholder="Optional note or requested change"></textarea><div class="actions"><button data-ready>Ready for signature</button><button class="secondary" data-change>Request changes</button><button class="secondary" data-decline>Decline</button>${c.externalSignatureUrl?`<a href="${esc(c.externalSignatureUrl)}" style="font:700 1rem system-ui;padding:11px 14px;border-radius:7px;background:#161616;color:white;text-decoration:none" rel="noopener noreferrer">Open signature service</a>`:''}</div>`;card.querySelector('[data-ready]').onclick=()=>respond('ready_to_sign');card.querySelector('[data-change]').onclick=()=>respond('request_changes');card.querySelector('[data-decline]').onclick=()=>respond('decline')}async function respond(action){try{const r=await fetch('/.netlify/functions/client-change-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access:token,action,note:document.getElementById('note').value})}),d=await r.json();if(!r.ok)throw Error(d.error);status.textContent=d.message;await load()}catch(e){status.textContent=e.message}}function sec(t,v){return v?`<div class="section"><h3>${esc(t)}</h3>${esc(v)}</div>`:''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
